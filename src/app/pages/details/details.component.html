<h2><a href="/">Go back</a></h2>
<section id="details" *ngIf="country$ | async as country">
    <h3>{{ country.country }}</h3>
    <div class="container">
        <div class="stats">
            Number of entries
            <strong>{{ country.entries }}</strong>
        </div>
        <div class="stats">
            Total number of medals
            <strong>{{ country.medals }}</strong>
        </div>
        <div class="stats">
            Total number of athletes
            <strong>{{ country.athletes }}</strong>
        </div>
    </div>
</section>
