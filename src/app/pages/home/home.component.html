<h2>Dashboard</h2>
<section id="dashboard">
    <h3>Medals per Country</h3>
    <div class="container">
        <div class="stats">
            Number of Olympics
            <strong>{{ olympicsCount$ | async }}</strong>
        </div>
        <div class="stats">
            Number of Countries
            <strong>{{ (olympics$ | async)?.length || 0 }}</strong>
        </div>
    </div>
</section>
