<h2>Dashboard</h2>
<section id="dashboard">
    <h3>Medals per Country</h3>
    <div class="container">
        <div class="stats">
            Number of Olympics
            <strong>{{ numberOfOlympics$ | async }}</strong>
        </div>
        <div class="stats">
            Number of Countries
            <strong>{{ numberOfCountries$ | async }}</strong>
        </div>
    </div>

    <div *ngFor="let c of countriesWithTotals$ | async">
            <h5><a [routerLink]="['/details', c.id]">{{ c.country }}</a></h5>
            <p>Total medals: {{ c.medals }}</p>
            <p>Total athletes: {{ c.athletes }}</p>
    </div>
